upstream seaweedfs_admin {
    server seaweedfs-admin:23646;
}

upstream seaweedfs_s3 {
    server seaweedfs:8333;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4G;

    # S3 clients send headers (x-amz-*) nginx would otherwise drop as invalid.
    ignore_invalid_headers off;

    # The admin UI.
    location / {
        proxy_pass http://seaweedfs_admin;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # S3, path-style: only buckets named bucket-<name> are routed here, the
    # same convention as the MinIO stack, so applications switch by changing
    # the endpoint and keys only.
    location ~ ^/bucket-(.*)$ {
        proxy_pass http://seaweedfs_s3;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_http_version 1.1;
        # $http_host, not $host: S3 signatures cover the Host header exactly as
        # the client sent it, port included.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
