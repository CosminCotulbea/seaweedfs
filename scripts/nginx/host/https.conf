
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{SERVER_NAMES}};

    # Obtained with `certbot certonly`, which never edits this file.
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN_HOST}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN_HOST}}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Matches nginx/custom.conf — otherwise this would be the tighter limit.
    client_max_body_size 4G;
    # S3 clients send headers (x-amz-*) nginx would otherwise drop as invalid.
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:{{HOST_PORT}};
        proxy_http_version 1.1;
        # $http_host, not $host: S3 signatures cover the Host header exactly as
        # the client sent it, port included, and the container nginx forwards it
        # unchanged to SeaweedFS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The admin UI may use websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Streams uploads and downloads instead of spooling them to disk first.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
