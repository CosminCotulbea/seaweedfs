# Generated by scripts/nginx/host/host-proxy.sh (PROXY_MODE=host) — edit the template in
# the repository, not the copy on the server: the next start overwrites it.

server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAMES}};

    # A `location`, not a server-level `return`: certbot's nginx authenticator
    # injects an exact-match location for the ACME challenge, which only wins
    # over a location-level redirect. A server-level return would run first.
    location / {
        return 301 https://$host$request_uri;
    }
}
